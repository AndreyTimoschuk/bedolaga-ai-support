services:
  telegram-bot:
    build: .
    container_name: support-telegram-bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Europe/Moscow}
      REDIS_URL: redis://redis:6379
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    networks:
      - support
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: support-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    networks:
      - support
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    container_name: support-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-supportbot}
      POSTGRES_USER: ${POSTGRES_USER:-supportbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-support-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-supportbot} -d ${POSTGRES_DB:-supportbot}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - support
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: support-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    networks:
      - support
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  n8n:
    image: n8nio/n8n:latest
    container_name: support-n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      TZ: ${TZ:-Europe/Moscow}
      GENERIC_TIMEZONE: ${TZ:-Europe/Moscow}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-http://localhost:5678/}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: ${N8N_BLOCK_ENV_ACCESS_IN_NODE:-false}
      # Used by workflow expressions ($env.*)
      TELEGRAM_GROUP_ID: ${TELEGRAM_GROUP_ID:-}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-support_bot}
      CABINET_URL: ${CABINET_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TELEGRAM_USER_BOT_TOKEN: ${TELEGRAM_USER_BOT_TOKEN:-}
      # Inject OpenAI + Telegram user-bot secrets into matching credential types
      # Generated by scripts/gen-n8n-credentials-overwrite.sh (called from start.sh)
      CREDENTIALS_OVERWRITE_DATA_FILE: /credentials-overwrite.json
      # Reach sibling containers by Docker DNS names from n8n credentials
      # Postgres: host=postgres port=5432
      # Redis: host=redis port=6379
      # Qdrant: http://qdrant:6333
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/import/workflows:ro
      - ./n8n/credentials-overwrite.json:/credentials-overwrite.json:ro
    networks:
      - support
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis_data:
  postgres_data:
  qdrant_data:
  n8n_data:

networks:
  support:
    name: support-net
